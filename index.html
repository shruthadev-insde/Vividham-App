<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vividham · The Costume Wardrobe</title>
  <meta name="theme-color" content="#FBF9F6">
  <meta name="view-transition" content="same-origin">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/icon-192.png">
  <link rel="apple-touch-icon" href="assets/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="splash" class="splash"></div>

  <header class="topbar">
    <button class="brand" data-act="go" data-tab="today" aria-label="Home">
      <img src="assets/img/logo.jpg" alt="Vividham logo">
      <span><b>Vividham</b><small>The Costume Wardrobe</small></span>
    </button>
    <nav class="tabs" id="tabs" aria-label="Main"></nav>
    <div class="top-actions">
      <button class="langbtn" id="langbtn" data-act="lang" aria-label="Language"></button>
      <button class="clock" id="clock" data-act="clockMenu" aria-label="Date"></button>
      <button class="bagbtn" id="bagbtn" data-act="openBag" aria-label="Rental bag"></button>
    </div>
  </header>

  <main id="view" class="view"></main>
  <nav class="bottombar" id="bottombar" aria-label="Main"></nav>

  <div id="sheet" class="sheet-wrap" hidden></div>
  <div id="showcase" class="showcase-wrap" hidden></div>
  <div id="toast" class="toast" role="status"></div>
  <div id="print" class="print-area"></div>

  <script src="data/inventory.js"></script>
  <script src="data/renders.js"></script>
  <script src="data/icons.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/art.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/core.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sheets.js"></script>
  <script src="js/more.js"></script>
  <script src="js/ops.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
